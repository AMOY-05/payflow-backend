version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: fintech_user
      POSTGRES_PASSWORD: fintech_pass
      POSTGRES_DB: fintech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech_user -d fintech_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"

  celery_worker:
    build: .
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4

  celery_beat:
    build: .
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    command: celery -A app.core.celery_app beat --loglevel=info

  flower:
    build: .
    restart: always
    depends_on:
      - redis
    env_file:
      - .env
    ports:
      - "5555:5555"
    command: celery -A app.core.celery_app flower --port=5555

volumes:
  postgres_data: